services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      GAMES_SERVICE_URL: http://games-service:8000
      CLUES_SERVICE_URL: http://clues-service:8000
      FAVORITES_SERVICE_URL: http://favorites-service:8000
    depends_on:
      games-service:
        condition: service_healthy
      clues-service:
        condition: service_healthy
      favorites-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  games-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.services.games.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/termodejogos
    depends_on:
      migrations:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  clues-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.services.clues.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/termodejogos
    depends_on:
      migrations:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  favorites-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.services.favorites.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/termodejogos
    expose:
      - "8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/termodejogos
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: termodejogos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d termodejogos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
